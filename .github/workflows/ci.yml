name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain
        run: xcodebuild -version
      - name: Test packaging workflow
        run: python3 -m unittest discover -s Tests/Packaging -v
      - name: Run native unit tests
        run: ./scripts/test-native.sh -only-testing:ShorelineTests
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.runner }}
          path: .build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
